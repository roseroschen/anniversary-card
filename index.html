  :root{
    --word:#ad4f0c;          /* colour of the floating words */
    --ink:#3b342a;           /* letter text */
    --glow:255,226,130;      /* aura colour (r,g,b) */
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    background:#fffdf8;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
    user-select:none; -webkit-user-select:none;
    cursor:pointer;
  }

  /* ---------- Stage: a fixed-size scene scaled to fit the screen ---------- */
  #viewport{position:fixed;inset:0;overflow:hidden}
  #stage{
    position:absolute; left:50%; top:50%;
    transform-origin:0 0;
    opacity:0; transition:opacity .8s ease;
  }
  #stage.ready{opacity:1}
  .item{position:absolute; left:0; top:0; will-change:transform}

  .potato{width:726px;height:783px;display:block;pointer-events:none}
  .potato img{width:100%;height:100%;display:block;-webkit-user-drag:none}
  .bg .inner{transition:opacity 1.4s ease, filter 1.4s ease; filter:brightness(1.05) saturate(.92)}
  #stage.ghost .bg .inner{opacity:.3; filter:brightness(1.35) saturate(.45)}

  /* ---------- Aura ---------- */
  #glow{pointer-events:none; opacity:0; transition:opacity 1.3s ease}
  #glow .halo{
    position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(closest-side, rgba(var(--glow),.85) 0%, rgba(var(--glow),.55) 35%, rgba(var(--glow),.2) 68%, rgba(var(--glow),0) 100%);
    filter:blur(10px);
    animation:breathe 4.5s ease-in-out infinite;
  }
  #glow .rays{
    position:absolute; inset:8%; border-radius:50%;
    background:repeating-conic-gradient(from 0deg, rgba(255,255,255,.0) 0deg 9deg, rgba(255,247,215,.55) 12deg, rgba(255,255,255,0) 15deg 26deg);
    -webkit-mask:radial-gradient(closest-side, #000 20%, transparent 100%);
            mask:radial-gradient(closest-side, #000 20%, transparent 100%);
    filter:blur(6px); opacity:.8;
    animation:spin 60s linear infinite;
  }
  #stage.aura #glow{opacity:1}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Starburst sparkles */
  .flare{
    position:absolute; width:240px; height:240px; margin:-120px 0 0 -120px;
    pointer-events:none; opacity:0; transform:scale(.3);
    transition:opacity .8s ease, transform .8s cubic-bezier(.2,1.4,.4,1);
  }
  .flare::before,.flare::after{
    content:""; position:absolute; left:50%; top:50%; width:100%; height:5px; margin:-2.5px 0 0 -50%;
    background:linear-gradient(90deg, transparent, rgba(255,245,210,.95) 40%, #fff 50%, rgba(255,245,210,.95) 60%, transparent);
    border-radius:3px; filter:blur(1.2px);
  }
  .flare::before{transform:rotate(38deg)}
  .flare::after{transform:rotate(-38deg) scaleX(.7)}
  .flare i{
    position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(circle, #fff 0 4%, rgba(255,240,190,.75) 10%, rgba(255,230,150,.25) 22%, transparent 40%);
  }
  #stage.aura .flare{opacity:1; transform:scale(1); animation:twinkle 2.6s ease-in-out infinite}
  #stage.aura .flare.f2{animation-delay:-1.1s}
  #stage.aura .flare.f3{animation-delay:-.5s}
  #stage.aura .flare.f4{animation-delay:-1.8s}
  #stage.ghost .flare.onbg{opacity:0}
  @keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(.78) rotate(8deg)}}

  /* ---------- Words ---------- */
  .word{
    font-family:"Shrikhand", Georgia, serif;
    color:var(--word); white-space:nowrap; line-height:1;
    pointer-events:none; opacity:0;
  }
  .word span{display:inline-block}
  #stage.words-float .word span{animation:bob 3.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

  #letter.hidden-for-modal{visibility:hidden}

  .letter-text p{margin:0 0 .9em}
  .letter-text p:first-child{font-weight:600}
  .letter-text p:last-child{margin-bottom:0}

  /* ---------- Hint ---------- */
  #hint{
    position:fixed; left:50%; top:max(28px, env(safe-area-inset-top));
    transform:translate(-50%, -50%);
    display:flex; gap:14px; align-items:center;
    font-size:15px; color:#8a6a3a; letter-spacing:.01em;
    opacity:0; transition:opacity .6s ease; pointer-events:none; white-space:nowrap;
  }
  #hint.on{opacity:1}
  #hint .msg{animation:softpulse 2.2s ease-in-out infinite}
  @keyframes softpulse{0%,100%{opacity:.55}50%{opacity:1}}
  #restart{
    font:inherit; font-size:14px; color:#8a6a3a; background:none; border:none;
    text-decoration:underline; text-underline-offset:3px; cursor:pointer; padding:6px; display:none;
    pointer-events:auto;
  }
  #hint.end #restart{display:inline-block}
  #restart:focus-visible, .close-x:focus-visible, #letter:focus-visible{outline:3px solid #e2a82a; outline-offset:3px}

  /* ---------- Letter modal ---------- */
  #overlay{
    position:fixed; inset:0; z-index:10;
    background:rgba(60,44,20,.42);
    -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
    opacity:0; visibility:hidden; transition:opacity .45s ease, visibility 0s linear .45s;
    cursor:default;
  }
  #overlay.open{opacity:1; visibility:visible; transition:opacity .45s ease}

const stage = document.getElementById('stage');
const glow = document.getElementById('glow');
const hint = document.getElementById('hint'), hintMsg = document.getElementById('hintMsg');
const overlay = document.getElementById('overlay'), card = document.getElementById('card');
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const T = ms => reduce ? Math.min(ms, 250) : ms;

function el(tag, cls, parent){ const e = document.createElement(tag); if (cls) e.className = cls; if (parent) parent.appendChild(e); return e; }
function makePotato(extra){
  const d = el('div', 'item potato ' + (extra || ''));
  const inner = el('div', 'inner', d); inner.style.width = '100%'; inner.style.height = '100%';
  const img = el('img', '', inner); img.src = POTATO_SRC; img.alt = ''; img.draggable = false;
  return d;
}

// Letter text (paragraphs)
function fillText(target){
  target.textContent = '';
  LETTER.trim().split(/\n\s*\n/).forEach(par => {
    const p = el('p', '', target);
    par.split('\n').forEach((line, i) => { if (i) p.appendChild(document.createElement('br')); p.appendChild(document.createTextNode(line)); });
  });
}

const bgEls = L.bg.map((b, i) => makePotato('bg'));
const special = makePotato('special');
const bgFlares = [el('div','flare onbg f3'), el('div','flare onbg f4')];
bgFlares.forEach(f => f.appendChild(el('i')));
const spFlares = [el('div','flare f1'), el('div','flare f2')];
spFlares.forEach((f, i) => { f.appendChild(el('i')); f.style.left = (363 + FLARES_ON_SPECIAL[i][0]) + 'px'; f.style.top = (391 + FLARES_ON_SPECIAL[i][1]) + 'px'; special.appendChild(f); });

const letter = el('div', 'item'); letter.id = 'letter';
letter.setAttribute('role','button'); letter.setAttribute('aria-label','Open the letter');
const sheet = el('div', 'sheet', letter); const sheetText = el('div', 'letter-text', sheet);
fillText(sheetText); fillText(document.getElementById('cardText'));

const wordEls = WORDS.map(w => { const d = el('div', 'item word'); el('span', '', d).textContent = w; return d; });

// Stacking order: glow, back potatoes, letter (behind special), special, front potatoes, bg flares, words
bgEls.forEach((e, i) => { if (!L.bg[i].front) stage.appendChild(e); });
stage.appendChild(letter);
stage.appendChild(special);
bgEls.forEach((e, i) => { if (L.bg[i].front) stage.appendChild(e); });
bgFlares.forEach(f => stage.appendChild(f));
wordEls.forEach(w => stage.appendChild(w));

/* =====================================================================
   LAYOUT + TRANSFORMS
   ===================================================================== */
let lay = L, stageScale = 1;
const tf = p => `translate(${p.x}px, ${p.y}px) translate(-50%, -50%) rotate(${p.r || 0}deg) scale(${p.s == null ? 1 : p.s})`;
function setT(e, p){ e.style.transform = tf(p); }

function anim(e, frames, dur, easing, delay){
  const kf = frames.map(f => { const k = { transform: tf(f) }; if (f.offset != null) k.offset = f.offset; if (f.o != null) k.opacity = f.o; return k; });
  const a = e.animate(kf, { duration:T(dur), easing:easing || 'cubic-bezier(.45,0,.2,1)', delay:T(delay || 0), fill:'both' });
  return a.finished.then(() => {
    const last = frames[frames.length - 1];
    setT(e, last); if (last.o != null) e.style.opacity = last.o;
    a.cancel();
  }).catch(() => {});
}

function fit(){
  const vw = window.innerWidth, vh = window.innerHeight;
  const next = vw / vh < 0.95 ? P : L;
  const changed = next !== lay; lay = next;
  stage.style.width = lay.W + 'px'; stage.style.height = lay.H + 'px';
  const room = 70;                                   // space kept above the scene for the hint
  stageScale = Math.min(vw / lay.W, (vh - room - 20) / lay.H);
  const shift = room / 2;
  stage.style.top = `calc(50% + ${shift}px)`;
  stage.style.transform = `scale(${stageScale}) translate(-50%, -50%)`;
  // Hint sits just above the top of the scene
  const sceneTop = vh / 2 + shift - (lay.H * stageScale) / 2;
  hint.style.top = Math.max(40, sceneTop + 10) + 'px';
  glow.style.width = lay.glow.w + 'px'; glow.style.height = lay.glow.h + 'px';
  wordEls.forEach(w => w.style.fontSize = lay.wordSize + 'px');
  if (changed || !fit.done){ placeForStep(step); fit.done = true; }
}

// Where the special potato's sparkle offsets land in scene space
function flarePos(sp, off){
  const a = sp.r * Math.PI / 180;
  const x = off[0] * sp.s, y = off[1] * sp.s;
  return { x: sp.x + x*Math.cos(a) - y*Math.sin(a), y: sp.y + x*Math.sin(a) + y*Math.cos(a) };
}

// Put everything where it belongs for a step, without animating (used on load, resize, restart)
function placeForStep(s){
  lay.bg.forEach((b, i) => setT(bgEls[i], b));
  const sp = s === 0 ? lay.special.pile : s === 1 ? lay.special.pop : s < 4 ? lay.special.center : lay.special.aside;
  setT(special, sp);
  setT(glow, { x:sp.x, y:sp.y, r:0, s:1 });
  // bg sparkles sit on two of the background potatoes
  setT(bgFlares[0], { x:lay.bg[1].x + 60, y:lay.bg[1].y - 70, r:0, s:1 });
  setT(bgFlares[1], { x:lay.bg[6].x - 40, y:lay.bg[6].y + 95, r:0, s:.9 });
  WORDS.forEach((w, i) => {
    const [x, y] = lay.words[w];
    setT(wordEls[i], { x, y, r:0, s:1 }); wordEls[i].style.opacity = s === 3 ? 1 : 0;
  });
  if (s === 4){ setT(letter, lay.letter); letter.style.opacity = 1; }
  else { setT(letter, { ...lay.special.center, s:.4 }); letter.style.opacity = 0; }
}

/* =====================================================================
   THE STORY — one tap per step, everything in between plays by itself
   ===================================================================== */
let step = 0, busy = true, gen = 0;

function showHint(){
  hintMsg.textContent = HINTS[step] || '';
  hint.classList.toggle('end', step === 4);
  hint.classList.add('on');
}
function hideHint(){ hint.classList.remove('on'); }
const wait = ms => new Promise(r => setTimeout(r, T(ms)));

async function advance(){
  if (busy || step >= 4) return;
  busy = true; hideHint();
  const g = gen, S = lay.special;

  if (step === 0){
    // The middle potato pops up out of the pile and floats up-left
    const lift = { ...S.pile, y:S.pile.y - 90, s:S.pile.s * 1.04, offset:.32 };
    stage.insertBefore(special, bgFlares[0]);         // in front of the pile as it lifts out
    stage.insertBefore(letter, special);
    // little jostle in the pile
    bgEls.forEach((e, i) => {
      const b = lay.bg[i], d = (i % 2 ? 1 : -1) * 3;
      anim(e, [b, { ...b, r:b.r + d, y:b.y + 4, offset:.4 }, b], 700, 'ease-out', 150);
    });
    await anim(special, [S.pile, lift, S.pop], 1200, 'cubic-bezier(.3,.1,.25,1)');
    step = 1;
  }
  else if (step === 1){
    // Swings to the middle, grows, then the aura blooms and the others fade
    const path = [S.pop, { ...S.swing, offset:.42 }, S.center];
    anim(glow, [{ x:S.pop.x, y:S.pop.y }, { x:S.swing.x, y:S.swing.y, offset:.42 }, { x:S.center.x, y:S.center.y }], 1600);
    await anim(special, path, 1600, 'cubic-bezier(.45,0,.25,1)');
    if (g !== gen) return;
    stage.classList.add('aura');
    await wait(1500);
    if (g !== gen) return;
    stage.classList.add('ghost');
    await wait(1300);
    step = 2;
  }
  else if (step === 2){
    // The words pop out one by one
    const c = S.center;
    await Promise.all(WORDS.map((w, i) => {
      const [x, y] = lay.words[w];
      return anim(wordEls[i], [{ x:c.x, y:c.y, s:.15, o:0 }, { x, y, s:1.12, o:1, offset:.75 }, { x, y, s:1, o:1 }],
                  850, 'cubic-bezier(.2,.8,.3,1)', i * 170);
    }));
    stage.classList.add('words-float');
    step = 3;
  }
  else if (step === 3){
    // Words drift away, the potato slides aside and the letter comes out from behind it
    stage.classList.remove('words-float');
    WORDS.forEach((w, i) => {
      const [x, y] = lay.words[w];
      anim(wordEls[i], [{ x, y, s:1, o:1 }, { x, y:y - 30, s:.9, o:0 }], 500, 'ease-in', i * 35);
    });
    await wait(450);
    if (g !== gen) return;
    const c = S.center, a = S.aside, Lt = lay.letter;
    anim(special, [c, a], 1300, 'cubic-bezier(.45,0,.2,1)');
    anim(glow, [{ x:c.x, y:c.y }, { x:a.x, y:a.y }], 1300);
    await anim(letter, [{ ...c, s:.4, o:0 }, { ...c, s:.5, o:1, offset:.12 }, { ...Lt, offset:1, o:1 }], 1500, 'cubic-bezier(.35,0,.2,1)', 120);
    letter.classList.add('shown'); letter.tabIndex = 0;
    step = 4;
  }
  if (g !== gen) return;
  busy = false;
  setTimeout(() => { if (g === gen && !busy) showHint(); }, T(step === 0 ? 1200 : 700));
}

/* =====================================================================
   LETTER MODAL
   ===================================================================== */
let modalOpen = false;
function letterStartTransform(){
  const r = letter.getBoundingClientRect();
  const cw = card.offsetWidth;
  const onScreenW = 741 * lay.letter.s * stageScale;
  const dx = r.left + r.width/2 - window.innerWidth/2;
  const dy = r.top + r.height/2 - window.innerHeight/2;
  return `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) rotate(${lay.letter.r}deg) scale(${onScreenW / cw})`;
}
function openLetter(){
  if (modalOpen || step !== 4) return;
  modalOpen = true; hideHint();
  card.classList.add('open'); overlay.classList.add('open');
  card.querySelector('.scroll').scrollTop = 0;
  const from = letterStartTransform();
  letter.classList.add('hidden-for-modal');
  card.animate([{ transform:from }, { transform:'translate(-50%,-50%) rotate(0deg) scale(1)' }],
               { duration:T(650), easing:'cubic-bezier(.2,.8,.2,1)' });
  document.getElementById('closeBtn').focus({ preventScroll:true });
}
function closeLetter(){
  if (!modalOpen) return;
  const to = letterStartTransform();
  overlay.classList.remove('open');
  const a = card.animate([{ transform:'translate(-50%,-50%) rotate(0deg) scale(1)' }, { transform:to }],
                         { duration:T(500), easing:'cubic-bezier(.5,0,.3,1)' });
  a.finished.then(() => {
    card.classList.remove('open'); letter.classList.remove('hidden-for-modal');
    modalOpen = false; letter.focus({ preventScroll:true }); showHint();
  });
}

/* =====================================================================
   RESTART
   ===================================================================== */
function restart(){
  gen++; busy = true; hideHint();
  stage.classList.remove('ready');
  setTimeout(() => {
    document.getAnimations().forEach(a => { if (a.effect && a.effect.target && stage.contains(a.effect.target)) a.cancel(); });
    step = 0;
    stage.classList.remove('aura', 'ghost', 'words-float');
    letter.classList.remove('shown'); letter.tabIndex = -1;
    bgEls.forEach((e, i) => { if (lay.bg[i].front) stage.appendChild(e); });
    stage.insertBefore(letter, bgEls.find((e,i) => lay.bg[i].front));
    stage.insertBefore(special, bgEls.find((e,i) => lay.bg[i].front));
    bgFlares.forEach(f => stage.appendChild(f));
    wordEls.forEach(w => stage.appendChild(w));
    placeForStep(0);
    stage.classList.add('ready');
    busy = false;
    setTimeout(() => { if (!busy && step === 0) showHint(); }, T(1400));
  }, T(800));
}

/* =====================================================================
   INPUT
   ===================================================================== */
document.addEventListener('click', e => {
  if (e.target.closest('#card') || e.target.closest('#restart')) return;
  if (modalOpen){ if (e.target === overlay) closeLetter(); return; }
  if (step === 4){ if (e.target.closest('#letter')) openLetter(); return; }
  advance();
});
document.getElementById('closeBtn').addEventListener('click', closeLetter);
document.getElementById('restart').addEventListener('click', e => { e.stopPropagation(); restart(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ closeLetter(); return; }
  if (modalOpen) return;
  if (e.key === 'Enter' || e.key === ' '){
    if (e.target.closest && e.target.closest('#restart')) return;
    e.preventDefault();
    if (step === 4) openLetter(); else advance();
  }
});
let rz = 0;
window.addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(fit); });

/* =====================================================================
   START (wait for the images and font so nothing pops in late)
   ===================================================================== */
fit();
const imgs = [...stage.querySelectorAll('img')].map(i => i.decode ? i.decode().catch(() => {}) : Promise.resolve());
Promise.all([...imgs, document.fonts ? document.fonts.load('72px "Shrikhand"') : null]).then(() => {
  stage.classList.add('ready');
  busy = false;
  setTimeout(() => { if (!busy && step === 0) showHint(); }, T(1400));
});
})();
</script>
</body>
</html>
